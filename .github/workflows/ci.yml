# Prüft jeden Push und Pull Request auf main: Rust-Tests und clippy, Oberfläche bauen, Übersetzungen, JS-Tests.
# Release-Builds und Signatur laufen weiter über scripts/release (docs/release.md); hier wird nichts veröffentlicht.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken für Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Übersetzungen
        run: node scripts/i18n.mjs check
      - name: JS-Tests
        run: node --test scripts/*.test.mjs
        shell: bash
      - name: Oberfläche bauen
        run: npm run build

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

  ios:
    # Nur kompilieren: Signieren und Hochladen bleiben auf dem Mac (App Store Connect).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo check (iOS)
        working-directory: src-tauri
        run: cargo check --lib --target aarch64-apple-ios
