[package]
name = "sesam-remote"
version = "0.1.0"
description = "Sesam Remote – VNC, SSH und SFTP in einer App"
authors = ["Sesam Remote Mitwirkende"]
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sesam_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: durchsichtiges Fenster für das Fenstermaterial (Vibrancy, docs/design-konzept.md); kein Mac App Store
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# ring statt aws-lc-rs: baut unter Windows ohne CMake/NASM
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2", "des"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time", "fs"] }
# VNC: Anmeldung (DES, Apple-DH mit AES/MD5), ZRLE und Zwischenablage (zlib)
des = "0.9"
aes = "0.9"
md5 = "0.8"
num-bigint = "0.5"
getrandom = "0.3"
flate2 = "1"
# VeNCrypt (TLS) mit Zertifikat-Pinning, ring wie bei russh
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
russh-sftp = "3"
# FTP/FTPS für Webserver (MIT/Apache-2.0); tokio und rustls mit ring wie oben, «deprecated» = implizites FTPS
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
# RDP (IronRDP): TLS mit ring wie überall, Graphics Pipeline (EGFX) ohne H.264
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["rustls-ring"] }
ironrdp-pdu = "0.11"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-egfx = "0.5"
ironrdp-input = "0.9"
ironrdp-graphics = "0.11"
ironrdp-cliprdr = "0.9"
# RD-Gateway (MS-TSGU über HTTPS/WebSocket); zieht über sspi aws-lc-rs mit, darum Provider ring fest installieren
ironrdp-mstsgu = { version = "0.1", features = ["rustls"] }
url = "2"
# Ton (nur PCM: ohne Opus/AAC keine C-Bibliotheken im Build)
ironrdp-rdpsnd = "0.11"
ironrdp-rdpsnd-native = { version = "0.8", default-features = false }
# Laufwerksfreigabe (ein lokaler Ordner) und Ordnerauswahl
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
tauri-plugin-dialog = "2"
# sesam://-Links (Desktop-Verknüpfungen) an die laufende App
tauri-plugin-deep-link = "2"
# Diagnose-Log und nachsichtiger Redirection-Decoder
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
base64 = "0.22"
# Zwischenablage mit Dateilisten und Bildern; Bilder gehen als PNG auf den Server
png = "0.18"
chrono = "0.4"
# Verschlüsselte Sicherung (src/backup.rs); beide schon im Baum (über sspi bzw. russh)
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

# Nur Desktop: zweiter Start an die laufende App, Zwischenablage (Dateilisten, Bilder), lokales Terminal.
# iPadOS/Android haben dafür keine Unterstützung bzw. keine eigenen Prozesse (src/clipshare.rs, src/localterm.rs).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
arboard = "3"
portable-pty = "0.9"

# iPadOS: Schlüsselbund über den «protected»-Speicher (keyring 4 kennt iOS nur so, src/vault.rs); beide schon im Baum.
[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }
# Zwischenablage über UIPasteboard (src/clipshare.rs); beide bringt Tauri auf iOS schon mit
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
# Face ID/Touch ID vor dem Anzeigen gespeicherter Passwörter (src/auth.rs), schon im Baum
block2 = "0.6"

# Windows-Zwischenablage für RDP (Text, Bilder, Dateien)
[target.'cfg(windows)'.dependencies]
ironrdp-cliprdr-native = "0.9"
# H.264 (EGFX AVC) über Media Foundation; dieselbe Version wie bei cpal/ironrdp im Baum
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage"] }

# SF Symbols (src/sfsymbol.rs) und Tastatur-Tap; dieselben Pakete und Versionen, die Tauri schon mitbringt
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSFontDescriptor", "NSWorkspace", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSData"] }
# Touch ID bzw. Mac-Passwort vor dem Anzeigen gespeicherter Passwörter (src/auth.rs)
objc2 = "0.6"
block2 = "0.6"
# Tastatur-Tap für ⌘Tab & Co. am Remotecomputer (src/kbhook.rs)
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
