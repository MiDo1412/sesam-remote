[package]
name = "sesam-remote"
version = "0.1.0"
description = "Sesam Remote – VNC, SSH und SFTP in einer App"
authors = ["Sesam Remote Mitwirkende"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sesam_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# ring statt aws-lc-rs: baut unter Windows ohne CMake/NASM
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time"] }
# VNC: Anmeldung (DES, Apple-DH mit AES/MD5), ZRLE und Zwischenablage (zlib)
des = "0.9"
aes = "0.9"
md5 = "0.8"
num-bigint = "0.5"
getrandom = "0.3"
flate2 = "1"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
