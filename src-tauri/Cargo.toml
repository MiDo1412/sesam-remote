[package]
name = "sesam-remote"
version = "0.1.0"
description = "Sesam Remote – VNC, SSH und SFTP in einer App"
authors = ["Sesam Remote Mitwirkende"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sesam_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
# ring statt aws-lc-rs: baut unter Windows ohne CMake/NASM
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time", "fs"] }
# VNC: Anmeldung (DES, Apple-DH mit AES/MD5), ZRLE und Zwischenablage (zlib)
des = "0.9"
aes = "0.9"
md5 = "0.8"
num-bigint = "0.5"
getrandom = "0.3"
flate2 = "1"
# VeNCrypt (TLS) mit Zertifikat-Pinning, ring wie bei russh
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
russh-sftp = "3"
# RDP (IronRDP): TLS mit ring wie überall, Graphics Pipeline (EGFX) ohne H.264
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", features = ["rustls-ring"] }
ironrdp-pdu = "0.11"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-egfx = "0.5"
ironrdp-input = "0.9"
ironrdp-graphics = "0.11"
ironrdp-cliprdr = "0.9"
# Ton (nur PCM: ohne Opus/AAC keine C-Bibliotheken im Build)
ironrdp-rdpsnd = "0.11"
ironrdp-rdpsnd-native = { version = "0.8", default-features = false }
# Laufwerksfreigabe (ein lokaler Ordner) und Ordnerauswahl
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
tauri-plugin-dialog = "2"
# Diagnose-Log und nachsichtiger Redirection-Decoder
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
base64 = "0.22"
# Zwischenablage mit Dateilisten und Bildern; Bilder gehen als PNG auf den Server
arboard = "3"
png = "0.18"
chrono = "0.4"

# Windows-Zwischenablage für RDP (Text, Bilder, Dateien)
[target.'cfg(windows)'.dependencies]
ironrdp-cliprdr-native = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
