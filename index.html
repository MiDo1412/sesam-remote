<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sesam Remote</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="library" class="app">
      <header class="toolbar">
        <label class="search">
          <span class="sr-only">Verbindungen suchen</span>
          <input id="search" type="search" placeholder="Verbindungen suchen" />
        </label>
      </header>
      <div class="body">
        <nav id="nav" aria-label="Bibliothek"></nav>
        <main>
          <section aria-labelledby="title" class="list">
            <div class="list-head">
              <h1 id="title">Alle Verbindungen</h1>
              <button id="new" type="button" class="primary">＋ Neue Verbindung</button>
            </div>
            <div id="grid" class="grid"></div>
            <p id="empty" class="empty" hidden>Noch keine Verbindungen. Lege mit «Neue Verbindung» die erste an.</p>
          </section>
          <aside id="details" aria-label="Details" hidden></aside>
        </main>
      </div>
    </div>

    <div id="session" class="session" hidden>
      <header class="session-bar">
        <button id="session-back" type="button" class="plain">‹ Bibliothek</button>
        <div>
          <h1 id="session-title"></h1>
          <div id="session-sub" class="sub"></div>
        </div>
        <div class="grow"></div>
        <div id="files-tools" class="tools" hidden>
          <button id="files-up" type="button" class="plain" title="Auswahl links auf den Server kopieren">Hochladen →</button>
          <button id="files-down" type="button" class="plain" title="Auswahl rechts auf diesen Computer kopieren">← Herunterladen</button>
          <button id="files-mkdir" type="button" class="plain">Neuer Ordner</button>
          <button id="files-rename" type="button" class="plain" title="Auswahl rechts umbenennen (F2)">Umbenennen</button>
          <button id="files-delete" type="button" class="plain danger" title="Auswahl rechts löschen (Entf)">Löschen</button>
        </div>
        <div id="desktop-tools" class="tools" hidden>
          <div class="segmented dark" role="radiogroup" aria-label="Anzeige">
            <label title="Entfernte Auflösung folgt der Fenstergrösse"><input type="radio" name="viewMode" value="fit" />An Fenster anpassen</label>
            <label><input type="radio" name="viewMode" value="scale" />Skalieren</label>
            <label><input type="radio" name="viewMode" value="native" />1:1</label>
          </div>
          <select id="send-keys" aria-label="Tastenkombination senden">
            <option value="" disabled>Tasten senden …</option>
            <option value="cad">Strg+Alt+Entf</option>
            <option value="cse">Strg+Umschalt+Esc</option>
            <option value="alttab">Alt+Tab</option>
            <option value="altf4">Alt+F4</option>
            <option value="super">Windows-/Super-Taste</option>
            <option value="print">Druck</option>
          </select>
          <button id="span" type="button" class="plain" title="Über alle Monitore (RDP); F11 beendet">Alle Monitore</button>
          <button id="fullscreen" type="button" class="plain" title="Vollbild (F11)">Vollbild</button>
        </div>
      </header>
      <div id="terminal" class="terminal"></div>
      <div id="desktop" class="desktop" hidden></div>
      <div id="files" class="files" hidden></div>
      <div id="session-status" role="status" class="status"></div>
    </div>

    <dialog id="editor" aria-labelledby="editor-title">
      <form id="editor-form" method="dialog" class="sheet">
        <h2 id="editor-title">Verbindung bearbeiten</h2>
        <label>Name<input name="name" required /></label>
        <label>Gruppe<input name="group" list="groups" /></label>
        <datalist id="groups"></datalist>
        <label class="span">Adresse<input name="address" required class="mono" autocomplete="off" spellcheck="false" /></label>
        <hr />
        <fieldset>
          <legend>Desktop <small>VNC</small> <button type="button" class="help-btn" data-help="vnc" aria-label="Hilfe zu VNC">?</button></legend>
          <label class="switch"><input type="checkbox" name="vncOn" /> Aktiv</label>
          <label>Port<input name="vncPort" type="number" min="1" max="65535" class="mono" /></label>
          <label class="span">VNC-Passwort
            <input name="vncPassword" type="password" autocomplete="new-password" />
            <span class="hint"><small id="vnc-pw-hint"></small><button type="button" class="link" id="vnc-pw-clear" hidden>Entfernen</button></span>
          </label>
        </fieldset>
        <fieldset>
          <legend>Desktop <small>RDP</small> <button type="button" class="help-btn" data-help="rdp-gnome" aria-label="Hilfe zu RDP">?</button></legend>
          <label class="switch"><input type="checkbox" name="rdpOn" /> Aktiv</label>
          <label>Port<input name="rdpPort" type="number" min="1" max="65535" class="mono" /></label>
          <label>Domäne<input name="rdpDomain" autocomplete="off" spellcheck="false" placeholder="optional" /></label>
          <label>RDP-Passwort
            <input name="rdpPassword" type="password" autocomplete="new-password" />
          </label>
          <span class="hint span"><small id="rdp-pw-hint"></small><button type="button" class="link" id="rdp-pw-clear" hidden>Entfernen</button></span>
          <label class="span">Ordner als Laufwerk freigeben
            <span class="pick">
              <input name="sharedFolder" class="mono" placeholder="aus" readonly />
              <button type="button" id="share-pick">Wählen …</button>
              <button type="button" id="share-clear" class="plain">Aus</button>
            </span>
          </label>
        </fieldset>
        <fieldset>
          <legend>Shell und Dateien <small>SSH mit SFTP</small> <button type="button" class="help-btn" data-help="ssh" aria-label="Hilfe zu SSH">?</button></legend>
          <label class="switch"><input type="checkbox" name="sshOn" /> Aktiv</label>
          <label>Port<input name="sshPort" type="number" min="1" max="65535" class="mono" /></label>
        </fieldset>
        <hr />
        <label>Benutzer<input name="user" autocomplete="off" /></label>
        <label>SSH-Schlüssel
          <select name="keyMode">
            <option value="keep">Unverändert</option>
            <option value="none">Keiner, nur Passwort</option>
            <option value="import">Schlüssel importieren …</option>
          </select>
        </label>
        <label class="span" id="key-row" hidden>Privater ed25519-Schlüssel (OpenSSH-Format)
          <textarea name="key" rows="4" class="mono" spellcheck="false"></textarea>
        </label>
        <label class="span">Passwort des Benutzers <small>für SSH und die macOS-Bildschirmfreigabe</small>
          <input name="password" type="password" autocomplete="new-password" />
          <span class="hint"><small id="pw-hint"></small><button type="button" class="link" id="pw-clear" hidden>Entfernen</button></span>
        </label>
        <hr />
        <label class="option"><span><b>Gemeinsame Zwischenablage</b><small>Text, Bilder und Dateien hier kopieren, dort einfügen</small></span><input type="checkbox" name="sharedClipboard" /></label>
        <label class="option"><span><b>Ton abspielen</b><small>Ton des entfernten Rechners hier hören (RDP)</small></span><input type="checkbox" name="playAudio" /></label>
        <label class="option"><span><b>An Fenster anpassen</b><small>Entfernte Auflösung folgt der Fenstergrösse</small></span><input type="checkbox" name="fitToWindow" /></label>
        <div class="row"><span>Ausrichtung des Monitors</span>
          <div class="segmented" role="radiogroup" aria-label="Ausrichtung des Monitors">
            <label><input type="radio" name="orientation" value="landscape" />Querformat</label>
            <label><input type="radio" name="orientation" value="portrait" />Hochformat</label>
          </div>
        </div>
        <div class="row" id="desktop-protocol-row"><span>Desktop über</span>
          <div class="segmented" role="radiogroup" aria-label="Desktop über">
            <label><input type="radio" name="desktopProtocol" value="rdp" />RDP</label>
            <label><input type="radio" name="desktopProtocol" value="vnc" />VNC</label>
          </div>
        </div>
        <div class="row"><span>Bei Doppelklick öffnen</span>
          <div class="segmented" role="radiogroup" aria-label="Standardansicht">
            <label><input type="radio" name="defaultView" value="desktop" />Desktop</label>
            <label><input type="radio" name="defaultView" value="shell" />Shell</label>
            <label><input type="radio" name="defaultView" value="files" />Dateien</label>
          </div>
        </div>
        <p id="editor-error" class="error span" role="alert"></p>
        <div class="row actions">
          <button type="button" id="editor-delete" class="danger">Löschen</button>
          <button type="button" id="editor-cancel">Abbrechen</button>
          <button type="submit" class="primary">Sichern</button>
        </div>
      </form>
    </dialog>

    <dialog id="help" aria-label="Hilfe">
      <div class="help">
        <nav id="help-nav" aria-label="Anleitungen"></nav>
        <article id="help-body"></article>
        <form method="dialog" class="help-close"><button class="plain" aria-label="Hilfe schliessen">Schliessen</button></form>
      </div>
    </dialog>

    <dialog id="ask" aria-labelledby="ask-title">
      <form method="dialog" class="alert">
        <h2 id="ask-title"></h2>
        <p id="ask-text"></p>
        <input id="ask-input" hidden autocomplete="off" spellcheck="false" aria-labelledby="ask-text" />
        <div class="pair">
          <button value="cancel" id="ask-cancel">Abbrechen</button>
          <button value="ok" id="ask-ok" class="primary">OK</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
